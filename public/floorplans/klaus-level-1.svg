<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1125 560" width="1125" height="560" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">Klaus Advanced Computing Building, Level 1</title>
  <desc id="map-description">Schematic traced from the Level 1 wall directory. Stair and elevator symbols show approximate locations from the directory. Seven exits are shown. Connections between wings and floors require field verification.</desc>
  <defs>
    <path id="research-wing" d="M24 363C132 210 359 44 655 11L668 266 628 271 628 416 665 431 665 486 642 486 642 541 571 541 571 515 523 517 481 541 469 530 452 541 302 333 276 284 155 393 136 416 130 411 119 427Z"/>
    <path id="classroom-wing" d="M743 10C864 13 997 48 1090 91L1054 169 1077 178 1061 205 1037 196 969 318 916 299 914 306 841 286 841 307 722 307Z"/>
    <path id="research-corridors" d="M57 385L92.5 339.5L136 294L174.25 260.0L223.75 218.0L268 185M268 185L316.5 154.5L364.75 128.25L418 104L472.0 85.0L527.5 71.0L583.75 60.75L645 54M645 54L647.67 108.67L650.0 166.5L653 219M268 185L298.33 228.33L320.0 263.5L347 309M347 309L406.0 282.0L474 254M474 254L535.0 236.5L589.5 225.0L653 219M347 309L376.5 359.0L409.8 413.0L445 473L478 524M478 524L535.0 492.0L608.5 463.0M608.5 463.0L602 550M57 385L41 404M645 54L679 53M474 254L513 325L545 368L575 414L608.5 463.0M608.5 463.0L690 453"/>
    <path id="classroom-corridors" d="M754 135L813 142L865.0 151.5L930.25 169.25L977.5 187.0L1058 221M754 135L747 193L742.67 243.0L737 328M754 135L711 135"/>
    <g id="stair-marker">
      <rect x="-11" y="-11" width="22" height="22" rx="4" fill="#fff" stroke="#727272" stroke-dasharray="2 2"/>
      <path d="M-6 5H-2V1H2V-3H6V-6" fill="none" stroke="#292929" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="elevator-marker">
      <rect x="-11" y="-11" width="22" height="22" rx="4" fill="#fff" stroke="#727272" stroke-dasharray="2 2"/>
      <path d="M-3 5V-5m-3 3 3-3 3 3m3-3V5M0 2l3 3 3-3" fill="none" stroke="#292929" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="exit-marker">
      <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#292929"/>
      <path d="M-5 -5H-1V5H-5M-2 0H5M2 -3L5 0L2 3" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1125" height="560" fill="#fff"/>
  <g fill="#ededed" stroke="#272727" stroke-width="2.5" stroke-linejoin="round">
    <use xlink:href="#research-wing"/>
    <use xlink:href="#classroom-wing"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#c7c7c7" stroke-width="17">
      <use xlink:href="#research-corridors"/>
      <use xlink:href="#classroom-corridors"/>
    </g>
    <g stroke="#fff" stroke-width="14">
      <use xlink:href="#research-corridors"/>
      <use xlink:href="#classroom-corridors"/>
    </g>
  </g>

  <path aria-label="Open atrium" d="M490 301L626 273V416L663 432V483H605L558 470 576 426Z" fill="#fff"/>
  <use xlink:href="#research-wing" fill="none" stroke="#272727" stroke-width="2.5" stroke-linejoin="round"/>

  <path aria-label="Open exit corridors" d="M608.5 463.0L602 550M977.5 187.0L1058 221M742.67 243.0L737 328M57 385L41 404M645 54L679 53M608.5 463.0L690 453M754 135L711 135" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>

  <g fill="#262626" font-family="Helvetica" font-size="23" font-weight="bold" text-anchor="middle">
    <text x="476" y="140">1300s</text>
    <text x="507" y="206">1200s</text>
    <text x="474" y="391">1100s</text>
    <text x="891" y="224">1400s</text>
  </g>
  <text x="584" y="355" fill="#555" font-family="Helvetica" font-size="13" text-anchor="middle">Atrium</text>

  <g aria-label="Approximate stair and elevator markers from the wall directory">
    <use xlink:href="#stair-marker" x="113" y="407"/>
    <use xlink:href="#stair-marker" x="565" y="444"/>
    <use xlink:href="#stair-marker" x="624" y="500"/>
    <use xlink:href="#stair-marker" x="775" y="294"/>
    <use xlink:href="#stair-marker" x="1045" y="180"/>
    <use xlink:href="#elevator-marker" x="445" y="299"/>
    <use xlink:href="#elevator-marker" x="583" y="493"/>
    <use xlink:href="#elevator-marker" x="800" y="252"/>
  </g>

  <g aria-label="Exits">
    <use xlink:href="#exit-marker" x="41" y="404"><title>1300s west exit</title></use>
    <use xlink:href="#exit-marker" x="679" y="53"><title>1300s east exit</title></use>
    <use xlink:href="#exit-marker" x="690" y="453"><title>Atrium east exit</title></use>
    <use xlink:href="#exit-marker" x="602" y="550"><title>1100s south exit</title></use>
    <use xlink:href="#exit-marker" x="711" y="135"><title>1400s bend exit</title></use>
    <use xlink:href="#exit-marker" x="1058" y="221"><title>1400s east exit</title></use>
    <use xlink:href="#exit-marker" x="737" y="328"><title>1400s southwest exit</title></use>
  </g>

  <g font-family="Helvetica">
    <text x="742" y="401" fill="#262626" font-size="24" font-weight="bold">Klaus · Level 1</text>
    <text x="742" y="424" fill="#555" font-size="13">Schematic indoor map</text>
    <path d="M742 439H1039" stroke="#d8d8d8"/>
    <use xlink:href="#stair-marker" x="753" y="461"/>
    <text x="773" y="465" fill="#383838" font-size="13">Stairs</text>
    <use xlink:href="#elevator-marker" x="859" y="461"/>
    <text x="879" y="465" fill="#383838" font-size="13">Elevator</text>
    <use xlink:href="#exit-marker" x="956" y="461"/>
    <text x="974" y="465" fill="#383838" font-size="13">Exit</text>
    <text x="742" y="494" fill="#555" font-size="12">Dashed markers indicate approximate locations.</text>
  </g>
</svg>
